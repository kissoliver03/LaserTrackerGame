meta:
  title: "input_test"
  version: "1.0.0"

globals:
  lives: 100
  score: 100

layout:
  map_size: [32, 18] # 32x18 grid
  background_color: [0,0,0]

entities:
  - name: "ball"
    type: "kinematic"
    grid_pos: [10, 10]
    size: [1, 1]
    shape: "rect"
    model: "assets/models/ball.png"

  - name: "wall_top"
    group: "walls_x"   # Horizontal walls group
    type: "static"
    grid_pos: [ 0, 0 ]
    size: [ 32, 1 ]      # 1 width full screen-width
    shape: "rect"
    tile: true
    model: "assets/models/wall.png"

  - name: "wall_bottom"
    group: "walls_x"
    type: "static"
    grid_pos: [ 0, 17 ]  # Down
    size: [ 32, 1 ]
    shape: "rect"
    tile: true
    model: "assets/models/wall.png"

  - name: "wall_right"
    group: "walls_y"   # Vertical walls group
    type: "static"
    grid_pos: [ 31, 0 ]  # Right side
    size: [ 1, 17 ]      # 1 width top to bottom
    shape: "rect"
    tile: true
    model: "assets/models/wall.png"


inputs:
  - name: "player1"
    source: "laser_red"
    target: "ball"

  - name: "player2"
    source: "laser_green"
    target: "ball"