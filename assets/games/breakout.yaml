rules:
  - condition:
      type: "collision"
      targets: ["balls", "paddles"]
    action:
      - type: "bounce"
        axis: "y"

  - condition:
      type: "collision"
      targets: ["balls", "walls_x"]
    action:
      - type: "bounce"
        axis: "y"

  - condition:
      type: "collision"
      targets: ["balls", "walls_y"]
    action:
      - type: "bounce"
        axis: "x"

  - condition:
      type: "collision"
      targets: ["balls", "bricks"]
    action:
      - type: "bounce"
        axis: "y"
      - type: "destroy"
        targets: ["hit_2"]
      - type: "add_score"
        targets: ["player1"]
        value: 1

  - condition:
      type: "position"
      targets: ["coins"]
      axis: "y"
      operator: ">"
      value: 18
    action:
      - type: "destroy"
        targets: ["hit_1"]

  # 6. Labda leesése a pályáról (sebződés)
  - condition:
      type: "position"
      targets: ["balls"]
      axis: "y"
      operator: ">"
      value: 18
    action:
      - type: "destroy"
        targets: ["hit_1"]
      - type: "damage"
        targets: ["player1"]
        value: 1
      - type: "respawn"
        targets: ["ball_main"]
        pos: [15, 14]

  # 7. Érme random lerakása 10 másodpercenként fentről
  - condition:
      type: "timer"
      interval: 5000
      repeat: true
    action:
      - type: "spawn"
        template: "coin"
        pos: [[2, 2], [28, 2]]
        velocity: [0, 4]

  # 8. Ütő felveszi az érmét -> Új labda!
  - condition:
      type: "collision"
      targets: ["coins", "paddles"]
    action:
      - type: "destroy"
        targets: ["hit_1"]
      - type: "spawn"
        template: "extra_ball"
        origin: "paddle"
        direction: "up"
        velocity: [8, -8]
