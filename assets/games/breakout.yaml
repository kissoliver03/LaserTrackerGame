meta:
  title: "breakout"
  version: "1.0.0"

globals:
  lives: 90000
  score: 150

layout:
  map_size: [32, 18]
  background_color: [0, 0, 0] # Sötétkék űr-háttér

inputs:
  - name: "player1"
    source: "laser_red"
    target: "paddle"

templates:
  - name: "coin"
    group: "coins"
    type: "dynamic"
    size: [1, 1]
    shape: "circle"
    model: "assets/models/coin.png"

  - name: "extra_ball"
    group: "balls"
    type: "dynamic"
    size: [1, 1]
    shape: "circle"
    model: "assets/models/ball.png"

entities:
  # --- JÁTÉKOS ÉS KEZDŐ LABDA ---
  - name: "paddle"
    group: "paddles"
    type: "kinematic"
    grid_pos: [14, 16]
    size: [1, 4]
    shape: "rect"
    model: "assets/models/paddle.png"
    constraints: ["x"]
    rotation: 270

  - name: "ball_main"
    group: "balls"
    type: "dynamic"
    grid_pos: [15, 14]
    size: [1, 1]
    shape: "circle"
    model: "assets/models/ball.png"
    velocity: [10, -10]

  # --- PÁLYA SZÉLEI (FALAK) ---
  - name: "wall_top"
    group: "walls_x"
    type: "static"
    grid_pos: [0, 0]
    size: [32, 1]
    shape: "rect"
    model: "assets/models/wall.png"
    tile: true

  - name: "wall_left"
    group: "walls_y"
    type: "static"
    grid_pos: [0, 1]
    size: [1, 17]
    shape: "rect"
    model: "assets/models/wall.png"
    tile: true

  - name: "wall_right"
    group: "walls_y"
    type: "static"
    grid_pos: [31, 1]
    size: [1, 17]
    shape: "rect"
    model: "assets/models/wall.png"
    tile: true
      
      # --- 0. SOR (Y: 1) ---
